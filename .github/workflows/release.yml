name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 25
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: ${{ hashFiles('package-lock.json') != '' && 'npm' || '' }}
      - name: Sürümü etiketten al (v0.0.2 -> 0.0.2)
        shell: bash
        run: |
          v="${GITHUB_REF_NAME#v}"
          echo "$v" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.]+)?$' || { echo "Geçersiz etiket: $GITHUB_REF_NAME (örnek: v0.1.0)"; exit 1; }
          npm version "$v" --no-git-tag-version --allow-same-version
      - name: Bağımlılıklar
        shell: bash
        run: if [ -f package-lock.json ]; then npm ci; else npm install; fi
      - name: Kurulumlu + portable EXE üret
        run: npm run dist
      - name: Artifact - kurulumlu
        uses: actions/upload-artifact@v4
        with:
          name: TankClient-Setup
          path: release/TankClient-Setup-*.exe
          if-no-files-found: error
          retention-days: 14
      - name: Artifact - portable
        uses: actions/upload-artifact@v4
        with:
          name: TankClient-Portable
          path: release/TankClient-Portable-*.exe
          if-no-files-found: error
          retention-days: 14
      # Release elle oluşturulmuşsa dosyalar ona yüklenir (başlığı/açıklaması değişmez); yoksa yeni release oluşturulur.
      - name: GitHub Release'e EXE'leri yükle
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="$GITHUB_REF_NAME"
          # SHA-256 özeti: uygulamadaki güncelleyici indirdiği dosyayı bununla doğrular
          (cd release && sha256sum TankClient-Setup-*.exe TankClient-Portable-*.exe > TankClient-SHA256.txt)
          files=(release/TankClient-Setup-*.exe release/TankClient-Portable-*.exe release/TankClient-SHA256.txt)
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "${files[@]}" --clobber
          else
            gh release create "$tag" "${files[@]}" --title "TankClient $tag" --generate-notes
          fi
