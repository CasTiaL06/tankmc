name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 25
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: ${{ hashFiles('package-lock.json') != '' && 'npm' || '' }}
      - name: Sürümü etiketten al (v0.0.2 -> 0.0.2)
        shell: bash
        run: |
          v="${GITHUB_REF_NAME#v}"
          echo "$v" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.]+)?$' || { echo "Geçersiz etiket: $GITHUB_REF_NAME (örnek: v0.1.0)"; exit 1; }
          npm version "$v" --no-git-tag-version --allow-same-version
      - name: Bağımlılıklar
        shell: bash
        run: if [ -f package-lock.json ]; then npm ci; else npm install; fi
      - name: Kurulumlu + portable EXE üret
        run: npm run dist
      - name: GitHub Release oluştur
        uses: softprops/action-gh-release@v2
        with:
          name: TankClient ${{ github.ref_name }}
          files: |
            release/TankClient-Setup-*.exe
            release/TankClient-Portable-*.exe
          generate_release_notes: true
