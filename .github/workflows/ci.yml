name: Build
on:
  push: { branches: [main] }
  pull_request:
  workflow_dispatch:
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 25
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: ${{ hashFiles('package-lock.json') != '' && 'npm' || '' }}
      - name: Bağımlılıklar
        shell: bash
        run: if [ -f package-lock.json ]; then npm ci; else npm install; fi
      - name: Derle (tip kontrolü + Vite) ve kurulumlu + portable EXE üret
        run: npm run dist
      - name: Artifact - kurulumlu
        uses: actions/upload-artifact@v4
        with:
          name: TankClient-Setup
          path: release/TankClient-Setup-*.exe
          if-no-files-found: error
          retention-days: 14
      - name: Artifact - portable
        uses: actions/upload-artifact@v4
        with:
          name: TankClient-Portable
          path: release/TankClient-Portable-*.exe
          if-no-files-found: error
          retention-days: 14
