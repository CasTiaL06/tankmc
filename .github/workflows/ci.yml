name: Build
on:
  push: { branches: [main] }
  pull_request:
  workflow_dispatch:
jobs:
  build:
    runs-on: windows-latest
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Bağımlılıklar
        shell: bash
        run: if [ -f package-lock.json ]; then npm ci; else npm install; fi
      - name: Derle ve portable EXE üret
        run: npm run dist
      - name: Portable EXE'yi yükle
        uses: actions/upload-artifact@v4
        with:
          name: TANKmc-Portable
          path: release/*.exe
